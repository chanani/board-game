services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: boardgame
      MYSQL_USER: boardgame
      MYSQL_PASSWORD: ${DB_PASSWORD:-boardgame}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/boardgame?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: boardgame
      DB_PASSWORD: ${DB_PASSWORD:-boardgame}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${ALLOWED_ORIGINS:-http://localhost:[*],http://127.0.0.1:[*]}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
