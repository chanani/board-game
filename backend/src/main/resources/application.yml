spring:
  datasource:
    url: jdbc:h2:file:./data/boardgame;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
      path: /h2-console

server:
  port: 8899
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax

app:
  websocket:
    allowed-origin-patterns: "${APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}"
  # 방장이 시작을 누른 뒤 방 안 모두에게 3-2-1을 보여 주고 게임을 시작하는 시간
  start-countdown:
    duration: 3s
