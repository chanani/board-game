# 컨텍스트마다 다른 메모리 DB를 쓴다(같은 DB를 나눠 쓰면 다른 컨텍스트의 create-drop으로 회원 번호가 다시 1부터 시작해, 살아 있는 방 레지스트리의 번호와 겹친다).
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
# 스프링 컨텍스트 테스트에서 실제 15초 턴 타이머가 돌지 않게 한다(TestTurnTimerConfig의 가짜 예약기 사용).
app.turn-timer.real-scheduler=false
# 테스트에서는 5초마다 도는 자동 기권 확인을 끄고, 메서드를 직접 부른다.
app.disconnect-forfeit.enabled=false
# 스프링 컨텍스트 테스트에서 컴퓨터가 실제로 움직이지 않게 한다(TestBotConfig의 가짜 예약기). STOMP 통합 테스트만 켠다.
app.bots.real-scheduler=false
# 스프링 컨텍스트 테스트는 플레이 순서를 섞지 않고 대기실 자리 순서 그대로 시작한다(순서 섞기는 단위 테스트에서 확인).
app.play-order.shuffle=false
